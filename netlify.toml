[build]
  publish = "public"
  functions = "netlify/functions"
  # Bundles the API + all npm packages into netlify/dist/api-bundle.mjs
  command = "npm run build"

# The API function (netlify/functions/api.mjs) serves /api/* via its own `config.path`.
# No SPA fallback is needed: the app navigates with #/ hash routes.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
