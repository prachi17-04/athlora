[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'No build step needed'"

[functions]
  node_bundler = "esbuild"

# The API function (netlify/functions/api.mjs) serves /api/* via its own `config.path`.
# No SPA fallback is needed: the app navigates with #/ hash routes.

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
